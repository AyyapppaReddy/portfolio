<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="150" y1="0" x2="150" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="450" y1="0" x2="450" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="750" y1="0" x2="750" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1050" y1="0" x2="1050" y2="675" />
  </g>

  <!-- Top App Window Header -->
  <rect x="50" y="35" width="1100" height="52" rx="10" fill="#1e293b" opacity="0.8" />
  <circle cx="85" cy="61" r="7" fill="#ef4444" />
  <circle cx="110" cy="61" r="7" fill="#f59e0b" />
  <circle cx="135" cy="61" r="7" fill="#10b981" />
  <text x="175" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">QuizGen AI Dashboard · Sequence-to-Sequence NLP (T5 &amp; BART)</text>
  <rect x="940" y="47" width="180" height="28" rx="6" fill="#334155" />
  <text x="965" y="65" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ PyTorch Engine Live</text>

  <!-- Left Column: Passage & Generation Config -->
  <rect x="50" y="105" width="460" height="530" rx="12" fill="#151e2e" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)" />
  
  <text x="80" y="145" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Source Educational Passage</text>
  <rect x="80" y="165" width="400" height="150" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="95" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
    <tspan x="95" dy="0">"Transformers revolutionized Natural Language Processing by</tspan>
    <tspan x="95" dy="20">discarding recurrent recurrence in favor of multi-head self-attention.</tspan>
    <tspan x="95" dy="20">This enables parallel sequence processing and direct modeling of</tspan>
    <tspan x="95" dy="20">token dependencies regardless of their contextual distance..."</tspan>
  </text>

  <text x="80" y="345" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Model Configuration</text>

  <rect x="80" y="365" width="190" height="50" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
  <text x="95" y="390" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">PRIMARY ARCHITECTURE</text>
  <text x="95" y="405" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">T5-Base / BART-Large</text>

  <rect x="290" y="365" width="190" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="305" y="390" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">DISTRACTOR LOGIC</text>
  <text x="305" y="405" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Cosine CosSim Embeddings</text>

  <!-- Metrics row -->
  <rect x="80" y="435" width="400" height="85" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="100" y="465" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">ATTENTION CONFIDENCE</text>
  <text x="100" y="495" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">98.4%</text>

  <text x="270" y="465" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">ROUGE-L SCORE</text>
  <text x="270" y="495" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">0.872</text>

  <text x="390" y="465" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">LATENCY</text>
  <text x="390" y="495" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">142ms</text>

  <!-- Generate button -->
  <rect x="80" y="540" width="400" height="48" rx="8" fill="url(#accentGrad)" />
  <text x="200" y="570" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">✨ Synthesizing Questions...</text>

  <!-- Right Column: Generated MCQ Card -->
  <rect x="540" y="105" width="610" height="530" rx="12" fill="#151e2e" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)" />
  
  <rect x="570" y="130" width="135" height="26" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
  <text x="585" y="147" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">GENERATED QUESTION 1</text>

  <text x="570" y="188" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">
    <tspan x="570" dy="0">Which architectural mechanism allows Transformers to capture global context</tspan>
    <tspan x="570" dy="24">across an entire sequence without recurrent feedback loops?</tspan>
  </text>

  <!-- Option A -->
  <rect x="570" y="240" width="550" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <circle cx="595" cy="263" r="11" fill="#1e293b" />
  <text x="591" y="267" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">A</text>
  <text x="620" y="268" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Recurrent Long Short-Term Memory (LSTM) cells</text>

  <!-- Option B (Correct Answer) -->
  <rect x="570" y="298" width="550" height="46" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <circle cx="595" cy="321" r="11" fill="#10b981" />
  <text x="591" y="325" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">✓</text>
  <text x="620" y="326" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Multi-Head Self-Attention Mechanism</text>
  <rect x="1005" y="308" width="100" height="26" rx="6" fill="#047857" />
  <text x="1018" y="325" fill="#d1fae5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">CORRECT KEY</text>

  <!-- Option C -->
  <rect x="570" y="356" width="550" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <circle cx="595" cy="379" r="11" fill="#1e293b" />
  <text x="591" y="383" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">C</text>
  <text x="620" y="384" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Dilated Temporal Convolutional Layers</text>

  <!-- Option D -->
  <rect x="570" y="414" width="550" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <circle cx="595" cy="437" r="11" fill="#1e293b" />
  <text x="591" y="441" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">D</text>
  <text x="620" y="442" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Gated Linear Recurrent Units</text>

  <!-- Educational Rationale / Explanation Box -->
  <rect x="570" y="475" width="550" height="120" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="590" y="505" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🧠 AI RATIONALE &amp; EXPLANATION</text>
  <text x="590" y="530" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
    <tspan x="590" dy="0">Multi-Head Self-Attention projects inputs into query, key, and value matrices,</tspan>
    <tspan x="590" dy="18">computing parallel pairwise affinities across all sequence positions simultaneously.</tspan>
    <tspan x="590" dy="18">This eliminates sequential bottlenecking found in traditional recurrent architectures.</tspan>
  </text>
</svg>
